[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-workspace-tools"
version = "0.2.2"
description = "Unified file system, shell execution, and async background task tools for autonomous AI agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agent-core-utils"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv.sources]
agent-core-utils = { git = "https://github.com/CodeCentury22/agent-core-utils.git", tag = "v0.2.2" }